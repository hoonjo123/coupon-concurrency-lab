spring:
  application:
    name: joney
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/coupon}
    username: ${SPRING_DATASOURCE_USERNAME:coupon}
    password: ${SPRING_DATASOURCE_PASSWORD:coupon}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    # 부하 테스트 시 stdout 동기 IO가 응답  latency에 박히므로 끔.
    # 로컬 디버깅이 필요하면 일시적으로 true로 바꿔서 확인하겠음.
    show-sql: false
  mvc:
    problemdetails:
      enabled: true

  logging:
    level:
      # 위와 같은 이유로 부하 측정용 로그 레벨 설정함.
      # 디버깅 시, DEBUG/TRACE 로 일시적으로 상향할 예정
      com.apiece.coupon: INFO
      org.hibernate.SQL: WARN
      org.hibernate.orm.jdbc.bind: WARN
